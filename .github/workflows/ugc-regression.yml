name: UGC regression
on:
  pull_request:
  push:
    branches:
      - fix/ugc-brief-quality-mobile-20261112
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: node --test tests/generator.test.cjs
      - run: npm run build
